name: CI Checks

on:
  pull_request:
    # types:
    #   - opened
    #   - synchronize
    #   - reopened
    #   # When a PR is closed, we still start this workflow, but then skip
    #   # all the jobs, which makes it effectively a no-op.  The reason to
    #   # do this is that it allows us to take advantage of concurrency groups
    #   # to cancel in progress CI jobs whenever the PR is closed.
    #   - closed
  workflow_dispatch:
  push:
    # branches:
    #   - 'release/**'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup VS environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Configure
        run: |
          cmake -G Ninja -B build -S llvm ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS=clang ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        shell: cmd

      - name: Build
        run: ninja -C build check-clang-driver check-clang-codegen

      - name: Test with python
        continue-on-error: true
        run: |
          cd build
          python3 ../llvm/utils/lit/lit.py -v ../clang/test/CodeGen/asan-prefix-map.cpp ../clang/test/CodeGen/ubsan-prefix-map.cpp ../clang/test/Driver/fsanitize-prefix-map.cpp

      - name: Test with llvm-lit
        run: |
          ./build/bin/llvm-lit -v clang/test/CodeGen/asan-prefix-map.cpp clang/test/CodeGen/ubsan-prefix-map.cpp clang/test/Driver/fsanitize-prefix-map.cpp

      # - name: Build
      #   run: |
      #     ninja -C build check-clang-codegen
